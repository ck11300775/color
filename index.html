<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深淺檢測器</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --text-color: #333333;
            --panel-bg: rgba(255, 255, 255, 0.9);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        /* 當判定為深色模式時，網頁背景與文字顏色同步切換 */
        body.dark-mode {
            --bg-color: #121212;
            --text-color: #ffffff;
            --panel-bg: rgba(30, 30, 30, 0.9);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 500px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            background: #000;
            aspect-ratio: 4 / 3;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 隱藏用來抓取像素的 Canvas */
        canvas {
            display: none;
        }

        .dashboard {
            width: 100%;
            max-width: 460px;
            margin-top: 20px;
            padding: 20px;
            background-color: var(--panel-bg);
            border-radius: 16px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            transition: background-color 0.4s ease;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 15px;
            text-align: center;
            width: calc(100% - 32px);
        }

        /* 狀態標籤顏色 */
        .badge-light { background-color: #e3f2fd; color: #0d47a1; }
        .badge-dark { background-color: #212121; color: #ffeb3b; border: 1px solid #ffeb3b; }
        .badge-gray { background-color: #eceff1; color: #37474f; }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 1rem;
        }

        .data-value {
            font-family: monospace;
            font-weight: bold;
        }

        .error-msg {
            color: #d32f2f;
            background: #ffebee;
            padding: 15px;
            border-radius: 8px;
            display: none;
            text-align: center;
            max-width: 400px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>身份檢測器</h1>

    <div class="container">
        <!-- 顯示相機串流 -->
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <!-- 用於背景處理影像數據的 Canvas -->
    <canvas id="analyzerCanvas"></canvas>

    <div class="dashboard">
        <div id="statusBadge" class="status-badge badge-light">初始化中...</div>
        
        <div class="data-row">
            <span>環境亮度 (Lightness):</span>
            <span id="valLightness" class="data-value">0%</span>
        </div>
        <div class="data-row">
            <span>色彩飽和 (Saturation):</span>
            <span id="valSaturation" class="data-value">0%</span>
        </div>
    </div>

    <div id="errorArea" class="error-msg"></div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('analyzerCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        const statusBadge = document.getElementById('statusBadge');
        const valLightness = document.getElementById('valLightness');
        const valSaturation = document.getElementById('valSaturation');
        const errorArea = document.getElementById('errorArea');

        // 1. 啟動相機
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                video.srcObject = stream;
                video.addEventListener('loadedmetadata', () => {
                    // 設定 Canvas 的取樣解析度（無須太高，160x120 即可確保流暢度與準確性）
                    canvas.width = 160;
                    canvas.height = 120;
                    tick();
                });
            } catch (err) {
                console.error("無法存取相機: ", err);
                errorArea.textContent = "無法啟動相機。請確認已允許瀏覽器使用相機權限，且網站使用的是 HTTPS 安全連線。";
                errorArea.style.display = "block";
                statusBadge.textContent = "錯誤";
            }
        }

        // 2. 每幀循環分析處理
        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // 將 Video 當前畫面繪製到縮小版的 Canvas 上
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // 取得所有像素的 RGBA 數據
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;
                
                let totalTotalLightness = 0;
                let totalSaturation = 0;
                let pixelCount = 0;

                // 逐像素讀取 RGB (步進 4 代表跳過 R, G, B, A 中的 A)
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i] / 255;
                    const g = data[i+1] / 255;
                    const b = data[i+2] / 255;

                    const max = Math.max(r, g, b);
                    const min = Math.min(r, g, b);
                    
                    // 計算明度 (Lightness)
                    let l = (max + min) / 2;
                    
                    // 計算彩度 (Saturation)
                    let s = 0;
                    if (max !== min) {
                        s = l > 0.5 ? (max - min) / (2 - max - min) : (max - min) / (max + min);
                    }

                    totalTotalLightness += l;
                    totalSaturation += s;
                    pixelCount++;
                }

                // 計算全畫面平均百分比值
                const avgL = Math.round((totalTotalLightness / pixelCount) * 100);
                const avgS = Math.round((totalSaturation / pixelCount) * 100);

                // 更新數據面板
                valLightness.textContent = `${avgL}%`;
                valSaturation.textContent = `${avgS}%`;

                // 3. 根據明度與彩度做出視覺狀態判定
                updateUIStatus(avgL, avgS);
            }
            
            // 請求下一幀動畫，維持即時更新
            requestAnimationFrame(tick);
        }

        // 4. 更新 UI 樣式與標籤
        function updateUIStatus(lightness, saturation) {
            // 清除現有狀態
            statusBadge.className = "status-badge";
            
            if (saturation <= 12) {
                // 彩度極低判定為灰階/無色彩
                statusBadge.textContent = "平民 (中間值)";
                statusBadge.classList.add("badge-gray");
                document.body.classList.remove("dark-mode");
            } else if (lightness >= 50) {
                // 明度高於 50% 判定為淺色
                statusBadge.textContent = "主人 (Light)";
                statusBadge.classList.add("badge-light");
                document.body.classList.remove("dark-mode");
            } else {
                // 明度低於 50% 判定為深色
                statusBadge.textContent = "內閣 (Dark)";
                statusBadge.classList.add("badge-dark");
                document.body.classList.add("dark-mode");
            }
        }

        // 初始化啟動
        window.addEventListener('DOMContentLoaded', initCamera);
    </script>
</body>
</html>
